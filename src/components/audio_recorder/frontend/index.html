<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Audio Recorder</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            margin: 0;
            padding: 10px;
            background: transparent;
        }

        .recorder-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .record-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .record-btn.idle {
            background: #ff4b4b;
        }

        .record-btn.idle:hover {
            background: #ff3333;
        }

        .record-btn.recording {
            background: #ff4b4b;
            animation: pulse 1.5s infinite;
        }

        .record-btn.has-recording {
            background: #4b9fff;
        }

        .record-btn.has-recording:hover {
            background: #3388ff;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        .record-icon {
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
        }

        .stop-icon {
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 3px;
        }

        .mic-icon {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .status {
            font-size: 14px;
            color: #666;
        }

        .status.recording {
            color: #ff4b4b;
            font-weight: 500;
        }

        .status.success {
            color: #28a745;
        }

        .timer {
            font-family: monospace;
            font-size: 14px;
            color: #333;
            min-width: 60px;
        }

        .audio-preview {
            width: 100%;
            height: 40px;
        }

        .info-text {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        .error {
            color: #dc3545;
            font-size: 14px;
        }

        .duration-warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 13px;
            color: #856404;
            display: none;
        }

        .duration-warning.visible {
            display: block;
        }

        .recovery-banner {
            background: #e7f3ff;
            border: 1px solid #4b9fff;
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 13px;
            color: #1a5fa8;
            display: none;
        }

        .recovery-banner button {
            margin-left: 8px;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #4b9fff;
            background: white;
            cursor: pointer;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="recorder-container">
        <div class="controls">
            <button id="recordBtn" class="record-btn idle" title="Click to start recording">
                <div class="record-icon"></div>
            </button>
            <span id="status" class="status">Click to start recording</span>
            <span id="timer" class="timer"></span>
        </div>
        <div id="audioContainer" style="display: none;">
            <audio id="audioPreview" class="audio-preview" controls></audio>
        </div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="durationWarning" class="duration-warning">
            ⚠️ Recording is over 30 minutes. Consider stopping and processing in segments for best results.
        </div>
        <div id="recoveryBanner" class="recovery-banner">
            <span id="recoveryText"></span>
            <button id="recoverBtn">Recover</button>
            <button id="discardBtn">Discard</button>
        </div>
        <div class="info-text">
            Speaker audio capture enabled (echo cancellation disabled)
        </div>
    </div>

    <script>
        // Streamlit component communication
        function sendBackMsg(type, data) {
            window.parent.postMessage({
                isStreamlitMessage: true,
                type: type,
                ...data
            }, "*");
        }

        function setComponentValue(value) {
            // For string data, use "json" dataType
            sendBackMsg("streamlit:setComponentValue", {
                value: value,
                dataType: "json"
            });
        }

        function setFrameHeight(height) {
            sendBackMsg("streamlit:setFrameHeight", { height: height });
        }

        function setComponentReady() {
            sendBackMsg("streamlit:componentReady", { apiVersion: 1 });
        }

        // Audio recording state
        let mediaRecorder = null;
        let audioChunks = [];
        let audioStream = null;
        let audioContext = null;
        let isRecording = false;
        let startTime = null;
        let timerInterval = null;

        // DOM elements
        const recordBtn = document.getElementById('recordBtn');
        const status = document.getElementById('status');
        const timer = document.getElementById('timer');
        const audioContainer = document.getElementById('audioContainer');
        const audioPreview = document.getElementById('audioPreview');
        const errorDiv = document.getElementById('error');
        const durationWarning = document.getElementById('durationWarning');
        const recoveryBanner = document.getElementById('recoveryBanner');
        const recoveryText = document.getElementById('recoveryText');
        const recoverBtn = document.getElementById('recoverBtn');
        const discardBtn = document.getElementById('discardBtn');

        // Warning threshold: 30 minutes in seconds
        const DURATION_WARNING_THRESHOLD = 30 * 60;

        // Format time as MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Update timer display
        function updateTimer() {
            if (startTime) {
                const elapsed = (Date.now() - startTime) / 1000;
                timer.textContent = formatTime(elapsed);

                // Show warning if recording exceeds threshold
                if (elapsed >= DURATION_WARNING_THRESHOLD) {
                    durationWarning.classList.add('visible');
                    setFrameHeight(180);
                }
            }
        }

        // --- IndexedDB checkpointing --------------------------------------
        // Every recorded chunk is checkpointed so a tab crash mid-recording
        // loses at most ~1 second of audio. Checkpoints are cleared when a
        // new recording starts or the user discards them -- deliberately not
        // right after sending, so a backend crash during send still leaves
        // the browser-side copy intact.
        const DB_NAME = 'transcriber-recorder';
        const CHUNK_STORE = 'chunks';
        let chunkSeq = 0;

        function openDb() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = () => {
                    const db = req.result;
                    if (!db.objectStoreNames.contains(CHUNK_STORE)) {
                        db.createObjectStore(CHUNK_STORE, { keyPath: 'seq' });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function idbPutChunk(seq, blob, mimeType) {
            const db = await openDb();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(CHUNK_STORE, 'readwrite');
                tx.objectStore(CHUNK_STORE).put({ seq: seq, blob: blob, mimeType: mimeType });
                tx.oncomplete = () => { db.close(); resolve(); };
                tx.onerror = () => { db.close(); reject(tx.error); };
            });
        }

        async function idbLoadChunks() {
            const db = await openDb();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(CHUNK_STORE, 'readonly');
                const req = tx.objectStore(CHUNK_STORE).getAll();
                req.onsuccess = () => {
                    db.close();
                    resolve(req.result.sort((a, b) => a.seq - b.seq));
                };
                req.onerror = () => { db.close(); reject(req.error); };
            });
        }

        async function idbClearChunks() {
            const db = await openDb();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(CHUNK_STORE, 'readwrite');
                tx.objectStore(CHUNK_STORE).clear();
                tx.oncomplete = () => { db.close(); resolve(); };
                tx.onerror = () => { db.close(); reject(tx.error); };
            });
        }

        // Efficient base64 without giant intermediate strings
        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(reader.error);
                reader.onload = () => {
                    const dataUrl = reader.result;
                    resolve(dataUrl.substring(dataUrl.indexOf(',') + 1));
                };
                reader.readAsDataURL(blob);
            });
        }

        // Process recording and send compressed audio directly to Streamlit
        async function processRecording(blob, mimeTypeOverride) {
            try {
                status.textContent = 'Processing...';

                const mimeType = mimeTypeOverride
                    || (mediaRecorder && mediaRecorder.mimeType)
                    || blob.type
                    || 'audio/webm';
                let format = 'webm';
                if (mimeType.includes('mp4') || mimeType.includes('m4a')) {
                    format = 'mp4';
                }

                // Read blob directly (NO DECODING - keep compressed!)
                const base64 = await blobToBase64(blob);

                // Send JSON with format metadata
                setComponentValue(JSON.stringify({
                    data: base64,
                    format: format,
                    mimeType: mimeType
                }));

                // Update UI
                const sizeKB = (blob.size / 1024).toFixed(1);
                status.className = 'status success';
                status.textContent = `Recording captured (${sizeKB} KB)`;

                // Preview using original blob
                audioPreview.src = URL.createObjectURL(blob);
                audioContainer.style.display = 'block';

            } catch (err) {
                console.error('Error processing recording:', err);
                errorDiv.textContent = 'Error processing recording: ' + err.message
                    + ' (your audio is still checkpointed locally -- reload to recover)';
                errorDiv.style.display = 'block';
            }
        }

        // Start recording
        async function startRecording() {
            try {
                errorDiv.style.display = 'none';
                durationWarning.classList.remove('visible');
                recoveryBanner.style.display = 'none';
                chunkSeq = 0;
                try {
                    await idbClearChunks();
                } catch (e) {
                    console.error('Could not clear old checkpoints:', e);
                }
                setFrameHeight(150);

                // Request microphone with echo cancellation DISABLED
                const constraints = {
                    audio: {
                        echoCancellation: false,
                        autoGainControl: false,
                        noiseSuppression: false,
                        channelCount: 1
                    }
                };

                audioStream = await navigator.mediaDevices.getUserMedia(constraints);

                // Log actual constraints applied
                const track = audioStream.getAudioTracks()[0];
                const settings = track.getSettings();
                console.log('Audio settings:', settings);
                console.log('Echo cancellation:', settings.echoCancellation);

                // Create MediaRecorder
                const options = { mimeType: 'audio/webm;codecs=opus' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    // Fallback for Safari
                    options.mimeType = 'audio/mp4';
                    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                        options.mimeType = '';
                    }
                }

                mediaRecorder = new MediaRecorder(audioStream, options);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                        chunkSeq += 1;
                        idbPutChunk(chunkSeq, event.data, mediaRecorder.mimeType)
                            .catch((err) => console.error('Checkpoint write failed:', err));
                    }
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
                    processRecording(blob);
                };

                mediaRecorder.onerror = (event) => {
                    console.error('MediaRecorder error:', event.error || event);
                    errorDiv.textContent = 'Recording error -- salvaging captured audio.';
                    errorDiv.style.display = 'block';
                    stopRecording();
                };

                mediaRecorder.start(1000); // Collect data every 1s (checkpointed to IndexedDB)
                isRecording = true;
                startTime = Date.now();

                // Update UI
                recordBtn.className = 'record-btn recording';
                recordBtn.innerHTML = '<div class="stop-icon"></div>';
                recordBtn.title = 'Click to stop recording';
                status.className = 'status recording';
                status.textContent = 'Recording...';

                // Start timer
                timerInterval = setInterval(updateTimer, 100);
                updateTimer();

            } catch (err) {
                console.error('Error starting recording:', err);
                errorDiv.textContent = 'Error accessing microphone: ' + err.message;
                errorDiv.style.display = 'block';
            }
        }

        // Stop recording
        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;

                // Stop all tracks
                if (audioStream) {
                    audioStream.getTracks().forEach(track => track.stop());
                }

                // Stop timer
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }

                // Update UI
                recordBtn.className = 'record-btn has-recording';
                recordBtn.innerHTML = '<div class="record-icon"></div>';
                recordBtn.title = 'Click to record again';
            }
        }

        // Toggle recording
        recordBtn.addEventListener('click', () => {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });

        // Offer recovery of chunks left behind by a crashed/closed tab
        async function checkRecovery() {
            try {
                const records = await idbLoadChunks();
                if (records.length === 0) {
                    return;
                }
                const totalBytes = records.reduce((sum, r) => sum + r.blob.size, 0);
                const mimeType = records[0].mimeType || 'audio/webm';
                const totalMB = (totalBytes / (1024 * 1024)).toFixed(1);
                recoveryText.textContent =
                    `Found an unsent recording checkpoint (${totalMB} MB).`;
                recoveryBanner.style.display = 'block';
                setFrameHeight(220);

                recoverBtn.onclick = async () => {
                    recoveryBanner.style.display = 'none';
                    const blob = new Blob(records.map((r) => r.blob), { type: mimeType });
                    await processRecording(blob, mimeType);
                };
                discardBtn.onclick = async () => {
                    try {
                        await idbClearChunks();
                    } catch (e) {
                        console.error('Could not discard checkpoints:', e);
                    }
                    recoveryBanner.style.display = 'none';
                };
            } catch (err) {
                console.error('Recovery check failed:', err);
            }
        }

        // Initialize component
        function init() {
            setFrameHeight(150);
            setComponentReady();
            checkRecovery();
        }

        // Handle messages from Streamlit
        function onMessage(event) {
            if (!event.data || event.data.type !== "streamlit:render") {
                return;
            }
            // Component is being rendered/re-rendered
            // Access args via event.data.args if needed
            setFrameHeight(150);
        }

        window.addEventListener("message", onMessage);
        init();
    </script>
</body>
</html>
