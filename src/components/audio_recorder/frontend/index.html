<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Audio Recorder</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            margin: 0;
            padding: 10px;
            background: transparent;
        }

        .recorder-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .record-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .record-btn.idle {
            background: #ff4b4b;
        }

        .record-btn.idle:hover {
            background: #ff3333;
        }

        .record-btn.recording {
            background: #ff4b4b;
            animation: pulse 1.5s infinite;
        }

        .record-btn.has-recording {
            background: #4b9fff;
        }

        .record-btn.has-recording:hover {
            background: #3388ff;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        .record-icon {
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
        }

        .stop-icon {
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 3px;
        }

        .mic-icon {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .status {
            font-size: 14px;
            color: #666;
        }

        .status.recording {
            color: #ff4b4b;
            font-weight: 500;
        }

        .status.success {
            color: #28a745;
        }

        .timer {
            font-family: monospace;
            font-size: 14px;
            color: #333;
            min-width: 60px;
        }

        .audio-preview {
            width: 100%;
            height: 40px;
        }

        .info-text {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        .error {
            color: #dc3545;
            font-size: 14px;
        }

        .duration-warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 13px;
            color: #856404;
            display: none;
        }

        .duration-warning.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div class="recorder-container">
        <div class="controls">
            <button id="recordBtn" class="record-btn idle" title="Click to start recording">
                <div class="record-icon"></div>
            </button>
            <span id="status" class="status">Click to start recording</span>
            <span id="timer" class="timer"></span>
        </div>
        <div id="audioContainer" style="display: none;">
            <audio id="audioPreview" class="audio-preview" controls></audio>
        </div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="durationWarning" class="duration-warning">
            ⚠️ Recording is over 30 minutes. Consider stopping and processing in segments for best results.
        </div>
        <div class="info-text">
            Speaker audio capture enabled (echo cancellation disabled)
        </div>
    </div>

    <script>
        // Streamlit component communication
        function sendBackMsg(type, data) {
            window.parent.postMessage({
                isStreamlitMessage: true,
                type: type,
                ...data
            }, "*");
        }

        function setComponentValue(value) {
            // For string data, use "json" dataType
            sendBackMsg("streamlit:setComponentValue", {
                value: value,
                dataType: "json"
            });
        }

        function setFrameHeight(height) {
            sendBackMsg("streamlit:setFrameHeight", { height: height });
        }

        function setComponentReady() {
            sendBackMsg("streamlit:componentReady", { apiVersion: 1 });
        }

        // Audio recording state
        let mediaRecorder = null;
        let audioChunks = [];
        let audioStream = null;
        let audioContext = null;
        let isRecording = false;
        let startTime = null;
        let timerInterval = null;

        // DOM elements
        const recordBtn = document.getElementById('recordBtn');
        const status = document.getElementById('status');
        const timer = document.getElementById('timer');
        const audioContainer = document.getElementById('audioContainer');
        const audioPreview = document.getElementById('audioPreview');
        const errorDiv = document.getElementById('error');
        const durationWarning = document.getElementById('durationWarning');

        // Warning threshold: 30 minutes in seconds
        const DURATION_WARNING_THRESHOLD = 30 * 60;

        // Format time as MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Update timer display
        function updateTimer() {
            if (startTime) {
                const elapsed = (Date.now() - startTime) / 1000;
                timer.textContent = formatTime(elapsed);

                // Show warning if recording exceeds threshold
                if (elapsed >= DURATION_WARNING_THRESHOLD) {
                    durationWarning.classList.add('visible');
                    setFrameHeight(180);
                }
            }
        }

        // Process recording and send compressed audio directly to Streamlit
        async function processRecording(blob) {
            try {
                status.textContent = 'Processing...';

                // Get format from MediaRecorder
                const mimeType = mediaRecorder.mimeType || blob.type;
                let format = 'webm';
                if (mimeType.includes('mp4') || mimeType.includes('m4a')) {
                    format = 'mp4';
                }

                // Read blob directly (NO DECODING - keep compressed!)
                const arrayBuffer = await blob.arrayBuffer();
                const bytes = new Uint8Array(arrayBuffer);

                // Base64 encode in chunks to avoid stack overflow on large files
                let binary = '';
                const chunkSize = 32768;
                for (let i = 0; i < bytes.length; i += chunkSize) {
                    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
                }
                const base64 = btoa(binary);

                // Send JSON with format metadata
                setComponentValue(JSON.stringify({
                    data: base64,
                    format: format,
                    mimeType: mimeType
                }));

                // Update UI
                const sizeKB = (bytes.length / 1024).toFixed(1);
                status.className = 'status success';
                status.textContent = `Recording captured (${sizeKB} KB)`;

                // Preview using original blob
                audioPreview.src = URL.createObjectURL(blob);
                audioContainer.style.display = 'block';

            } catch (err) {
                console.error('Error processing recording:', err);
                errorDiv.textContent = 'Error processing recording: ' + err.message;
                errorDiv.style.display = 'block';
            }
        }

        // Start recording
        async function startRecording() {
            try {
                errorDiv.style.display = 'none';
                durationWarning.classList.remove('visible');
                setFrameHeight(150);

                // Request microphone with echo cancellation DISABLED
                const constraints = {
                    audio: {
                        echoCancellation: false,
                        autoGainControl: false,
                        noiseSuppression: false,
                        channelCount: 1
                    }
                };

                audioStream = await navigator.mediaDevices.getUserMedia(constraints);

                // Log actual constraints applied
                const track = audioStream.getAudioTracks()[0];
                const settings = track.getSettings();
                console.log('Audio settings:', settings);
                console.log('Echo cancellation:', settings.echoCancellation);

                // Create MediaRecorder
                const options = { mimeType: 'audio/webm;codecs=opus' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    // Fallback for Safari
                    options.mimeType = 'audio/mp4';
                    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                        options.mimeType = '';
                    }
                }

                mediaRecorder = new MediaRecorder(audioStream, options);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
                    processRecording(blob);
                };

                mediaRecorder.start(100); // Collect data every 100ms
                isRecording = true;
                startTime = Date.now();

                // Update UI
                recordBtn.className = 'record-btn recording';
                recordBtn.innerHTML = '<div class="stop-icon"></div>';
                recordBtn.title = 'Click to stop recording';
                status.className = 'status recording';
                status.textContent = 'Recording...';

                // Start timer
                timerInterval = setInterval(updateTimer, 100);
                updateTimer();

            } catch (err) {
                console.error('Error starting recording:', err);
                errorDiv.textContent = 'Error accessing microphone: ' + err.message;
                errorDiv.style.display = 'block';
            }
        }

        // Stop recording
        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;

                // Stop all tracks
                if (audioStream) {
                    audioStream.getTracks().forEach(track => track.stop());
                }

                // Stop timer
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }

                // Update UI
                recordBtn.className = 'record-btn has-recording';
                recordBtn.innerHTML = '<div class="record-icon"></div>';
                recordBtn.title = 'Click to record again';
            }
        }

        // Toggle recording
        recordBtn.addEventListener('click', () => {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });

        // Initialize component
        function init() {
            setFrameHeight(150);
            setComponentReady();
        }

        // Handle messages from Streamlit
        function onMessage(event) {
            if (!event.data || event.data.type !== "streamlit:render") {
                return;
            }
            // Component is being rendered/re-rendered
            // Access args via event.data.args if needed
            setFrameHeight(150);
        }

        window.addEventListener("message", onMessage);
        init();
    </script>
</body>
</html>
